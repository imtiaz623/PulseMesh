name: Build OffChat
on:
  workflow_dispatch:
    inputs:
      create_keystore:
        description: 'Run ONCE: create the Google Play upload key (then follow the steps in the chat)'
        type: boolean
        default: false
  push:
    branches: [main, master]

jobs:
  # ------------------------------------------------------------------
  # Run this ONCE (Actions -> Build OffChat -> Run workflow -> tick the box).
  # It makes your upload key. Download the "keystore-secrets" artifact, copy the
  # 3 values into Settings -> Secrets and variables -> Actions, then DELETE the artifact.
  # Use a PRIVATE repository for this.
  # ------------------------------------------------------------------
  keystore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_keystore }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Create upload keystore
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -storetype PKCS12 -keystore upload-keystore.jks -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=OffChat, O=OffChat, C=PK"
          {
            echo "KEYSTORE_BASE64=$(base64 -w0 upload-keystore.jks)"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=upload"
          } > keystore-secrets.txt
          echo "Created. Download the artifact and store these 3 values as GitHub secrets."
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: |
            keystore-secrets.txt
            upload-keystore.jks

  # ------------------------------------------------------------------
  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.create_keystore) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # pinned on purpose: "stable" moves and breaks older plugins
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Unpack project and prepare Android
        run: |
          test -f pulsemesh.zip || { echo "pulsemesh.zip is missing from the repo root"; exit 1; }
          rm -rf _build _scaffold
          mkdir _build
          unzip -q pulsemesh.zip -d _build
          flutter create --org com.pulsemesh --project-name pulsemesh --platforms android _scaffold
          (cd _scaffold && find . -type f) | while read -r f; do
            if [ ! -e "_build/pulsemesh/$f" ]; then
              mkdir -p "$(dirname "_build/pulsemesh/$f")"
              cp "_scaffold/$f" "_build/pulsemesh/$f"
            fi
          done
          rm -rf _build/pulsemesh/test
          cd _build/pulsemesh
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          python3 -c "import xml.dom.minidom as x; x.parse('android/app/src/main/AndroidManifest.xml'); print('manifest OK')"

      - name: Force newer compileSdk for plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.extensions.findByName('android')?.compileSdkVersion(36)
              }
            }
          }
          GRADLE
          sed -i 's/^          //' ~/.gradle/init.gradle
          cat ~/.gradle/init.gradle

      # Google Play only accepts a bundle signed with YOUR upload key.
      # Without the 3 secrets the build still works, signed with a debug key (testing only).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets found. Building with a debug key: fine for testing, Google Play will reject it."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/upload-keystore.jks"
          cat > _build/pulsemesh/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$GITHUB_WORKSPACE/upload-keystore.jks
          EOF
          python3 - <<'PY'
          import os
          f = '_build/pulsemesh/android/app/build.gradle.kts'
          if not os.path.exists(f):
              print('::warning::build.gradle.kts not found, signing not patched')
              raise SystemExit
          s = open(f).read()
          block = '''    signingConfigs {
              create("upload") {
                  val kp = java.util.Properties()
                  kp.load(java.io.FileInputStream(rootProject.file("key.properties")))
                  keyAlias = kp["keyAlias"] as String
                  keyPassword = kp["keyPassword"] as String
                  storeFile = file(kp["storeFile"] as String)
                  storePassword = kp["storePassword"] as String
              }
          }
          '''
          if 'create("upload")' not in s:
              s = s.replace('    buildTypes {', block + '    buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("upload")')
          open(f, 'w').write(s)
          print('signing patched')
          PY

      - name: Get packages
        working-directory: _build/pulsemesh
        run: |
          flutter --version
          flutter pub get

      - name: Analyze (prints real Dart errors)
        working-directory: _build/pulsemesh
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # versionCode = run number, so every upload to Google Play is higher than the last
      - name: Build release APK and Play bundle
        working-directory: _build/pulsemesh
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --no-shrink --build-number=${{ github.run_number }} -v 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          flutter build appbundle --release --no-tree-shake-icons --no-shrink --build-number=${{ github.run_number }} 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"

      - name: Show real error (only if the build failed)
        if: failure()
        run: |
          echo "=========== REAL ERRORS ==========="
          grep -nE "Error:|error:|\.dart:[0-9]+:[0-9]+|Execution failed|Could not|FAILURE|What went wrong" build.log | head -60 || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: OffChat-apk
          path: _build/pulsemesh/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OffChat-play-bundle
          path: _build/pulsemesh/build/app/outputs/bundle/release/app-release.aab
