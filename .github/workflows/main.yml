name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android and Add Permissions
        run: |
          # Ensure android scaffold exists and is clean
          if [ ! -d "android" ]; then
            flutter create --org com.pulsemesh --project-name pulsemesh --platforms android .
          fi
          
          # Add Internet Permission to AndroidManifest to prevent white screen crashes
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
              sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
            fi
          fi

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PulseMesh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
