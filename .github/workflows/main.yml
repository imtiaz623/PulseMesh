name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX 1: pin Flutter. "channel: stable" jumped to 3.47.x, which is much newer than
      # the plugin versions in pubspec.yaml (record, camera, audioplayers, nearby_connections...)
      # were written for. A pinned version gives the same result on every run.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Unpack project and prepare Android
        run: |
          test -f pulsemesh.zip || { echo "pulsemesh.zip is missing from the repo root"; exit 1; }
          rm -rf _build _scaffold
          mkdir _build
          unzip -q pulsemesh.zip -d _build
          flutter create --org com.pulsemesh --project-name pulsemesh --platforms android _scaffold
          (cd _scaffold && find . -type f) | while read -r f; do
            if [ ! -e "_build/pulsemesh/$f" ]; then
              mkdir -p "$(dirname "_build/pulsemesh/$f")"
              cp "_scaffold/$f" "_build/pulsemesh/$f"
            fi
          done
          rm -rf _build/pulsemesh/test
          cd _build/pulsemesh
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle || true
          python3 -c "import xml.dom.minidom as x; x.parse('android/app/src/main/AndroidManifest.xml'); print('manifest OK')"

      - name: Force newer compileSdk for plugins
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle <<'GRADLE'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('com.android.library')) {
                p.extensions.findByName('android')?.compileSdkVersion(36)
              }
            }
          }
          GRADLE
          sed -i 's/^          //' ~/.gradle/init.gradle
          cat ~/.gradle/init.gradle

      - name: Get packages and show resolved versions
        working-directory: _build/pulsemesh
        run: |
          flutter --version
          flutter pub get
          echo "---- resolved plugin versions ----"
          flutter pub deps --no-dev --style=compact | grep -E "record|camera|audioplayers|nearby|permission_handler|sqflite|image_picker" || true

      # FIX 2: shows the exact file:line of any Dart error in the app code, before Gradle hides it.
      - name: Analyze (prints real Dart errors)
        working-directory: _build/pulsemesh
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # FIX 3: keep the full log and print the real error lines (Gradle's summary hides them).
      - name: Build release APK
        working-directory: _build/pulsemesh
        run: |
          set -o pipefail
          flutter build apk --release --no-tree-shake-icons --no-shrink -v 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Show real error (only if the build failed)
        if: failure()
        run: |
          echo "=========== REAL ERRORS ==========="
          grep -nE "Error:|error:|\.dart:[0-9]+:[0-9]+|Execution failed|Could not|FAILURE|What went wrong" build.log | head -60 || true

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: PulseMesh-apk
          path: _build/pulsemesh/build/app/outputs/flutter-apk/app-release.apk
