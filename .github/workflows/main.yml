name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Force Recreate Android Scaffold & Add Internet Permission
        run: |
          # Purana kharab android folder mukammal delete kar dein taake fresh build bane
          rm -rf android
          flutter create --org com.pulsemesh --project-name pulsemesh --platforms android .
          
          # Python ke zariye safe tareeqay se internet permission add karein taake XML error na aaye
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            python3 -c "
            with open('$MANIFEST_PATH', 'r') as f:
                content = f.read()
            if 'android.permission.INTERNET' not in content:
                content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
                with open('$MANIFEST_PATH', 'w') as f:
                    f.write(content)
            "
          fi

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PulseMesh-apk
          path: build/app/outputs/flutter-apk/app-release.apk
