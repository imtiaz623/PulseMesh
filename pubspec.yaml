name: pulsemesh
description: Offline peer-to-peer messenger built on Google Nearby Connections (BLE + Bluetooth Classic + Wi-Fi).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  nearby_connections: ^4.0.0     # Google Nearby Connections wrapper (P2P_CLUSTER)
  permission_handler: ^11.3.1    # runtime permissions
  sqflite: ^2.3.3                # local SQLite database
  path_provider: ^2.1.3
  path: ^1.9.0
  provider: ^6.1.2               # state management
  image_picker: ^1.1.2           # media attachments
  shared_preferences: ^2.2.3     # profile + settings
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
